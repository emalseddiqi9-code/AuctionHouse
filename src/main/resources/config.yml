settings:
  default-max-auctions: 3        # overridden by permission auctionhouse.auctions.<number>
  auction-duration-hours: 48
  min-price: 1
  max-price: 1000000000
  sell-tax-percent: 5            # taken from the seller's payout
  sold-history-days: 7           # how long /ah sold keeps entries
  broadcast-on-sell: true
  blacklist: [BEDROCK, BARRIER, COMMAND_BLOCK, STRUCTURE_BLOCK]

triggers:
  sign-lines: ["[AuctionHouse]", "[AH]"]   # first line of a sign (permission: auctionhouse.trigger.sign)
  entity-tag: auctionhouse                  # /tag <entity> add auctionhouse (permission: auctionhouse.trigger.entity)
  blocks: []                                # "world,100,64,200" (permission: auctionhouse.trigger.block)

# Discord webhook: Server Settings -> Integrations -> Webhooks -> New Webhook -> Copy Webhook URL
webhook:
  enabled: false
  url: ""
  username: "AuctionHouse"
  avatar-url: ""
  footer: "AuctionHouse - made by itzblace"
  events:
    listed: true       # a player puts an item into the auction house
    sold: true         # an item is bought
    cancelled: false   # an auction is cancelled
    expired: false     # an auction expires
  # Who gets pinged per event. Leave "" for no ping. Examples:
  #   "@everyone"  "@here"  "<@&ROLE_ID>" (role)  "<@USER_ID>" (one person)
  mentions:
    listed: ""
    sold: ""
    cancelled: ""
    expired: ""
  titles:
    listed: "New auction"
    sold: "Item sold"
    cancelled: "Auction cancelled"
    expired: "Auction expired"
  colors:              # decimal color of the embed bar
    listed: 3447003
    sold: 5763719
    cancelled: 15548997
    expired: 16705372
  labels:
    item: "Item"
    price: "Price"
    seller: "Seller"
    buyer: "Buyer"

